version: "3.8"
services:
  # Container 1: Jenkins
  # Imagem customizada do Jenkins com Node.js, npm, zip e Python.
  jenkins:
    image: duartefrugoli/steam-api-jenkins:latest
    container_name: jenkins
    privileged: true
    ports:
      - "8080:8080" # Interface web do Jenkins
      - "50000:50000" # Porta de agentes Jenkins
    volumes:
      - jenkins_home:/var/jenkins_home # Persiste configurações e jobs
      - reports:/shared-reports # Compartilha os relatórios do Jenkins com o Nginx
      - ./steam_api.postman_environment.json:/var/jenkins_home/steam_api.postman_environment.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NOTIFY_EMAIL=${NOTIFY_EMAIL} # Passado via arquivo .env
    networks:
      - devops-net
    depends_on:
      - mailhog
      - newman-runner
    user: "jenkins:root"

  # Container 2: Newman Runner
  # Imagem pronta do Docker Hub. O pipeline principal roda Newman dentro do Jenkins.
  newman-runner:
    image: postman/newman:latest
    container_name: newman-runner
    working_dir: /etc/newman
    volumes:
      - .:/etc/newman:ro
      - reports:/reports
    networks:
      - devops-net
    # Mantém o quarto container ativo sem exigir um Dockerfile próprio do Newman.
    entrypoint: ["/bin/sh", "-c"]
    command: ["newman --version && tail -f /dev/null"]
    labels:
      description: "Container que executa os testes Newman dentro do Jenkins."

  # Container 3: MailHog
  # Servidor SMTP falso. Captura e-mails do Jenkins sem enviá-los de verdade.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025" # Porta SMTP (usada pelo notify.py)
      - "8025:8025" # Interface web para visualizar e-mails recebidos
    networks:
      - devops-net

  # Container 4: Nginx (servidor de relatórios)
  # Serve os HTMLs gerados pelo Newman como páginas web acessíveis.
  report-server:
    image: nginx:alpine
    container_name: report-server
    ports:
      - "8090:80" # Acesse em http://localhost:8090
    volumes:
      - reports:/usr/share/nginx/html:ro # Lê os relatórios gerados pelo Jenkins
    networks:
      - devops-net
    depends_on:
      - jenkins

# Volumes
volumes:
  jenkins_home: # Persiste todo estado do Jenkins entre reinicializações
  reports: # Compartilhado entre Jenkins (escrita) e Nginx (leitura)

# Rede interna
networks:
  devops-net:
    driver: bridge
